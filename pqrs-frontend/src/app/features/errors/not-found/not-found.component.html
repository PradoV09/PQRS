<main class="not-found-page" role="main" aria-labelledby="nf-title">
  <div class="nf-card">

    <!-- Ilustración SVG -->
    <div class="nf-illustration" aria-hidden="true">
      <svg viewBox="0 0 200 160" width="200" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="20" width="120" height="140" rx="8" fill="#F0F0EE" stroke="#E2E2DE" stroke-width="2"/>
        <rect x="56" y="44" width="88" height="8" rx="4" fill="#E2E2DE"/>
        <rect x="56" y="60" width="60" height="8" rx="4" fill="#E2E2DE"/>
        <rect x="56" y="76" width="74" height="8" rx="4" fill="#E2E2DE"/>
        <circle cx="100" cy="116" r="28" fill="#FCEBEB" stroke="#F0B4B4" stroke-width="2"/>
        <line x1="93" y1="109" x2="107" y2="123" stroke="#c53030" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="107" y1="109" x2="93" y2="123" stroke="#c53030" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="nf-title" id="nf-title">¡Ups! Esta página no existe</h1>
    <p class="nf-description">Esta página no existe o fue movida a otra dirección. No te preocupes, puedes continuar desde aquí.</p>

    <!-- Botones de recuperación -->
    <div class="nf-actions">
      <app-button variant="primary" (click)="goHome()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Ir al inicio
      </app-button>
      <app-button variant="secondary" (click)="goBack()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Volver atrás
      </app-button>
    </div>

    <!-- Links sugeridos -->
    <div class="nf-links">
      <p class="nf-links-label">Links útiles:</p>
      <div class="nf-links-row">
        <button class="nf-link" (click)="goPqrs()">Mis PQRS</button>
        <button class="nf-link" (click)="goHome()">Dashboard</button>
      </div>
    </div>

  </div>
</main>
