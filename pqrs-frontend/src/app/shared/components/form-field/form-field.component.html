<div class="form-field" [class.form-field--error]="hasError" [class.form-field--valid]="isValid">
  <label *ngIf="label" class="form-label">
    {{ label }}
    <span *ngIf="required" class="form-required" aria-hidden="true">*</span>
  </label>

  <ng-content></ng-content>

  <p *ngIf="hint && !hasError && !isValidating" class="form-hint">{{ hint }}</p>

  <p *ngIf="isValidating" class="form-hint form-hint--loading">
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 0.8s linear infinite;display:inline-block">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
    </svg>
    Verificando…
  </p>

  <p *ngIf="hasError" class="form-error" role="alert">
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    {{ errorMessage }}
  </p>
</div>
