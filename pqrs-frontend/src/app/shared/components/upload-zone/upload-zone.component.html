<div class="upload-zone">
  <div
    [class.dragover]="dragOver"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    (click)="fileInput.click()"
    role="button"
    aria-label="Zona de carga de archivos"
    tabindex="0"
    (keydown.enter)="fileInput.click()">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    <p>Arrastra archivos aquí o haz clic para seleccionar</p>
    <p class="upload-hint">JPG, PNG, PDF, DOCX, MP4 · máx {{maxSizeMB}} MB por archivo · máx {{maxFiles}} archivos</p>
  </div>
  <input #fileInput type="file" [accept]="accept" multiple hidden (change)="onFileInputChange($event)">

  <div *ngIf="errors.length > 0" class="upload-errors">
    <p *ngFor="let err of errors" class="error-text">{{ err }}</p>
  </div>

  <ul *ngIf="selectedFiles.length > 0" class="file-list">
    <li *ngFor="let f of selectedFiles; let i = index" [class.has-error]="f.error">
      <div class="file-preview">
        <ng-container [ngSwitch]="f.type">
          <img *ngSwitchCase="'image'" [src]="f.previewUrl" alt="" width="64" height="64" class="preview-image">
          <svg *ngSwitchCase="'video'" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" class="preview-icon">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
          <svg *ngSwitchCase="'doc'" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" class="preview-icon">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <svg *ngSwitchDefault viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" class="preview-icon">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
        </ng-container>
      </div>
      <div class="file-info">
        <span class="file-name" [title]="f.name">{{ f.name }}</span>
        <span class="file-size">{{ f.sizeFormatted }}</span>
        <span *ngIf="f.error" class="file-error">{{ f.error }}</span>
      </div>
      <button (click)="removeFile(i)" aria-label="Quitar {{ f.name }}" class="remove-btn">✕</button>
    </li>
  </ul>
</div>
