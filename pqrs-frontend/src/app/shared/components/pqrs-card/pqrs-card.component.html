<article class="pqrs-card" [routerLink]="['/pqrs', pqrs.id]" role="article" tabindex="0"
  (keydown.enter)="null">
  <div class="pqrs-card-header">
    <app-status-badge [status]="pqrs.estado" size="sm"></app-status-badge>
    <app-status-badge [status]="pqrs.prioridad" size="sm"></app-status-badge>
  </div>

  <p class="pqrs-card-type">{{ pqrs.tipo | pqrsType }}</p>
  <h3 class="pqrs-card-title">{{ pqrs.titulo }}</h3>

  <div class="pqrs-card-meta">
    <span class="meta-item" aria-label="Fecha de creación">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      {{ pqrs.createdAt | date:'dd/MM/yyyy' }}
    </span>
    <span *ngIf="pqrs._count?.attachments" class="meta-item">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
      {{ pqrs._count?.attachments }}
    </span>
    <span *ngIf="pqrs._count?.respuestas" class="meta-item">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      {{ pqrs._count?.respuestas }}
    </span>
  </div>
</article>
